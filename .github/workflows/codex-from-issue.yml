name: Codex from issue

on:
  issues:
    types:
      - labeled

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: codex-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'codex-ready'
    runs-on:
      - self-hosted
      - screen-spec
      - codex
    timeout-minutes: 60

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build trusted prompt envelope
        env:
          EVENT_PATH: ${{ github.event_path }}
          PROMPT_PATH: .github/codex-runtime/issue-prompt.md
        run: |
          mkdir -p .github/codex-runtime
          printf '%s\n' '.github/codex-runtime/' >> .git/info/exclude
          .github/scripts/build-issue-prompt.sh "${EVENT_PATH}" "${PROMPT_PATH}"

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Implement issue with Codex
        env:
          PROMPT_PATH: .github/codex-runtime/issue-prompt.md
        run: codex exec --full-auto - <"${PROMPT_PATH}"

      - name: Remove runtime prompt
        run: rm -rf .github/codex-runtime

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/issue-${{ github.event.issue.number }}
          commit-message: |
            feat: implement issue #${{ github.event.issue.number }}

            Generated by Codex from an approved GitHub Issue.
            Refs #${{ github.event.issue.number }}
          title: "Codex: ${{ github.event.issue.title }}"
          body: |
            Codexが #${{ github.event.issue.number }} の要件から生成したPRです。

            Closes #${{ github.event.issue.number }}
          labels: codex-generated
          delete-branch: true

      - name: Link pull request from issue
        if: steps.create-pr.outputs.pull-request-url != ''
        uses: actions/github-script@v7
        env:
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `NAS上のCodexがPRを作成しました: ${process.env.PR_URL}`,
            });
