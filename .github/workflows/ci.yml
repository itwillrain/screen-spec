name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build docs
        run: npm run build --workspace @screen-spec/docs

      - name: Build viewer
        run: npm run build --workspace @screen-spec/viewer

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Viewer E2E smoke test
        run: npm run test:e2e
