name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages デプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイをキャンセルせず、順番に実行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build docs (site root /screen-spec/)
        run: npm run build --workspace @screen-spec/docs

      - name: Build viewer (/screen-spec/viewer/)
        run: npm run build --workspace @screen-spec/viewer
        env:
          VIEWER_BASE: /screen-spec/viewer/

      # docs をルート、viewer を /viewer/ サブパスに統合して1アーティファクトにする
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r apps/docs/dist/. _site/
          mkdir -p _site/viewer
          cp -r apps/viewer/dist/. _site/viewer/

      - name: Verify Pages artifact
        run: |
          test -s _site/index.html
          test -s _site/viewer/index.html
          test -s _site/viewer/specs/manifest.json
          grep -q '/screen-spec/viewer/assets/' _site/viewer/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed viewer
        run: |
          viewer_url="${{ steps.deployment.outputs.page_url }}viewer/?screen=user-list&deploy=${{ github.sha }}"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$viewer_url" | grep -q '<title>screen-spec viewer<\/title>'; then
              exit 0
            fi
            sleep 10
          done
          echo "Viewer smoke test failed: $viewer_url" >&2
          exit 1
