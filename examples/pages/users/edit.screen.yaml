specVersion: "0.1"
screen:
  id: user-edit
  name: ユーザー編集画面
  group: ユーザー管理
  description: ユーザー情報を編集する画面
  route: /users/{userId}/edit

  # 画面パラメータ（path は route のプレースホルダ、query は URL クエリ）。
  params:
    path:
      userId:
        type: string
        required: true
        description: 対象ユーザーの ID
    query:
      tab:
        type: string
        default: profile
        enum: [profile, security]

  # 権限マトリクス（ADR 0004）。未指定は deny、"*" を個別指定で上書きする。
  accessControl:
    roles:
      admin:
        screen: { view: true }
        fields:
          "*": { view: true, edit: true }
        events:
          "*": { execute: true }
      editor:
        screen: { view: true }
        fields:
          "*": { view: true, edit: false }
          name: { edit: true }
          email: { edit: true }
        events:
          edit: { execute: true }
          submit: { execute: true }
          cancel: { execute: true }
      viewer:
        screen: { view: true }
        fields:
          "*": { view: true, edit: false }

  # デザイン参照（Figma・モックアップ画像・関連リンク）。UI 実装は伴わない。
  design:
    figma: https://www.figma.com/file/EXAMPLE/user-edit
    images:
      - url: wireframes/user-edit-viewing.svg
        caption: 初期表示（閲覧中）
      - url: wireframes/user-edit-editing.svg
        caption: 編集中
    links:
      - label: デザインガイドライン
        url: https://example.com/design-guide

  # 言語レベルのレイアウト（UI 非依存の構造）。フィールドはキー参照でセクションに配置する。
  layout:
    sections:
      - id: globalHeader
        region: header
        items:
          - component: appHeader
      - id: navigation
        region: sidebar
        items:
          - component: adminSidebar
      - id: basic
        title: 基本情報
        region: body
        fields: [introText, name, email, altEmail, editButton, submitButton]
        columns: 2
        items:
          - field: introText
          - field: name
          - field: email
          - field: altEmail
          - field: editButton
          - field: submitButton
      - id: authz
        title: 権限
        region: body
        fields: [role]
        items:
          - field: role
      - id: globalFooter
        region: footer
        items:
          - component: appFooter

  fields:
    # マップのキー（name / email / role）がフィールド識別子。記述順＝表示順（決定 #5, #6）。
    introText:
      label: 編集画面の説明
      type: label
      text: ユーザー情報を編集してください。
    editButton:
      label: 編集開始ボタン
      type: button
      text: 編集する
      eventId: edit
    submitButton:
      label: 保存ボタン
      type: button
      text: 保存する
      eventId: submit
    name:
      label: 氏名
      type: text
      required: true
      width: half
      validations:
        - $ref: "../../components/validations.yaml#/components/validations/Required"
        - rule: maxLength
          value: 50
          message: 50文字以内で入力してください
    # 外部コンポーネントを純粋参照（決定 #2, #3）。
    email:
      $ref: "../../components/fields.yaml#/components/fields/EmailField"
    role:
      label: ロール
      type: select
      # 既定値と編集可否条件。選択肢はScreen Dataから供給する。
      default: viewer
      placeholder: ロールを選択
      enabledWhen: fields.name != ""
      # フィールド単位のデザイン参照。
      design:
        images:
          - url: wireframes/role-select.svg
            caption: ロール選択のモック
    altEmail:
      label: 予備メールアドレス
      type: email
      required: false
      width: half
      validations:
        - $ref: "../../components/validations.yaml#/components/validations/EmailFormat"
      # 表示条件（式エンジン）: role が admin のときのみ表示。
      visibleWhen: fields.role == "admin"

  # 画面が必要とする読み取り用の最小Projection。
  data:
    roleOptions:
      description: ロール選択肢
      schema:
        type: array
        items:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }

  # Screen DataとAPI実行状態をFieldの追加Inputへ接続する。
  fieldBindings:
    role:
      options:
        source: data.roleOptions
        item:
          value: id
          label: name
      loading:
        source: api.getUser.loading

  ui:
    appHeader:
      component:
        $ref: "../../components/ui.yaml#/components/ui/AppHeader"
      bindings:
        currentUserName.text: { value: 山田 太郎 }
        notifications.value: { value: 3 }
      events:
        logout: logout
    adminSidebar:
      component:
        $ref: "../../components/ui.yaml#/components/ui/AdminSidebar"
      bindings:
        navigationItems.activeItem: { value: users }
      events:
        navigate: navigateFromSidebar
    appFooter:
      component:
        $ref: "../../components/ui.yaml#/components/ui/AppFooter"
      bindings:
        copyright.text: { value: "© 2026 Example Inc." }
        legalLinks.value:
          value:
            - { id: privacy, label: プライバシー }
            - { id: terms, label: 利用規約 }

  # 状態遷移（決定 #10・案C）。キーが状態/イベント識別子、記述順が並び順。
  states:
    viewing:
      name: 閲覧中
      initial: true
    editing:
      name: 編集中
    submitting:
      name: 送信中
    error:
      name: エラー

  events:
    edit:
      trigger: click
      target: editButton
      from: viewing
      branches:
        - id: editable
          when: fields.role != "viewer"
          to: editing
        - id: readOnly
          otherwise: true
          to: viewing
          expects:
            state: viewing
            message: { kind: warning, text: 編集権限がありません }
    submit:
      trigger: click
      target: submitButton
      from: editing
      to: submitting
      expects:
        state: submitting
      action:
        apiCall: updateUser
      onSuccess:
        to: viewing
        navigate: user-list
        expects:
          state: viewing
          navigate: user-list
          message:
            kind: success
            text: 更新しました
      onError:
        to: error
        cases:
          - when:
              status: 400
              code: VALIDATION_ERROR
            to: editing
            expects:
              state: editing
              message:
                kind: error
                text: 入力内容を確認してください
        expects:
          state: error
          message:
            kind: error
            text: 更新に失敗しました
    cancel:
      trigger: click
      target: cancelButton
      from: editing
      to: viewing
    retry:
      trigger: click
      from: error
      to: editing

    navigateFromSidebar:
      trigger: { component: adminSidebar, event: navigate }
      from: viewing
      to: viewing
    logout:
      trigger: { component: appHeader, event: logout }
      from: viewing
      to: viewing

  transitions:
    toUserList:
      to: user-list
      trigger: submit.onSuccess

  # API 連携（決定 #11・案B）。型/制約は OpenAPI 側に委譲し、対応関係のみ記述する。
  apiBindings:
    getUser:
      openapi:
        operationId: getUserById
        specRef: ../../openapi/users.yaml
      request:
        path:
          userId: "{screen.route.userId}"
      response:
        mapping:
          fields.name: data.name
          fields.email: data.email
          fields.role: data.role
          data.roleOptions: roleOptions
    updateUser:
      openapi:
        operationId: updateUserById
        specRef: ../../openapi/users.yaml
      request:
        body:
          name: "{fields.name}"
          email: "{fields.email}"
          role: "{fields.role}"
