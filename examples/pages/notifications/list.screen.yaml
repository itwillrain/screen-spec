specVersion: "0.1"
screen:
  id: notification-list
  name: お知らせ一覧画面
  group: お知らせ管理
  description: 公開状態とキーワードでお知らせを検索し、運用対象を選択する画面
  route: /notifications
  design:
    images:
      - url: wireframes/notification-list.svg
        caption: お知らせ一覧
        mappings:
          - target: keyword
            regions: [{ x: 0.0792, y: 0.1765, width: 0.3125, height: 0.0941 }]
          - target: status
            regions: [{ x: 0.4125, y: 0.1765, width: 0.1979, height: 0.0941 }]
          - target: searchButton
            regions: [{ x: 0.6312, y: 0.2088, width: 0.1042, height: 0.0588 }]
          - target: createButton
            regions: [{ x: 0.7562, y: 0.2088, width: 0.1646, height: 0.0588 }]
          - target: notificationTable.rows
            regions: [{ x: 0.0792, y: 0.3529, width: 0.8417, height: 0.3824 }]
          - target: notificationPagination
            regions: [{ x: 0.6813, y: 0.7676, width: 0.2062, height: 0.0559 }]
  layout:
    sections:
      - { id: search, title: 検索条件, region: body, fields: [keyword, status, searchButton, createButton] }
      - id: results
        title: お知らせ
        region: body
        items: [{ component: notificationTable }, { component: notificationPagination }]
  fields:
    keyword:
      label: キーワード
      type: text
      placeholder: タイトルまたは本文を検索
      validations:
        - { rule: maxLength, value: 100, message: 検索キーワードは100文字以内で入力してください }
    status:
      label: 公開状態
      type: select
      options:
        - { value: draft, label: 下書き }
        - { value: scheduled, label: 公開予約 }
        - { value: published, label: 公開中 }
        - { value: archived, label: アーカイブ }
    searchButton: { label: 検索ボタン, type: button, text: 検索する, eventId: search }
    createButton: { label: 新規作成ボタン, type: button, text: お知らせを作成, eventId: createNotification }
  data:
    notificationRows:
      description: 一覧表示するお知らせ
      schema: { type: array, items: { type: object } }
    notificationTotal:
      description: 検索結果の総件数
      schema: { type: integer }
    currentPage:
      schema: { type: integer }
    pageSize:
      schema: { type: integer }
  ui:
    notificationTable:
      component: { $ref: "../../components/ui.yaml#/components/ui/DataTable" }
      bindings:
        rows.value: { source: data.notificationRows }
        rows.rowKey: { value: id }
        rows.loading: { source: api.listNotifications.loading }
        header.value:
          value:
            - { key: title, label: タイトル }
            - { key: status, label: 公開状態 }
            - { key: channel, label: 配信先 }
            - { key: publishAt, label: 公開日時 }
      events:
        rowSelect: openNotification
        sortChange: sortNotifications
    notificationPagination:
      component: { $ref: "../../components/ui.yaml#/components/ui/Pagination" }
      bindings:
        summary.value.totalCount: { source: data.notificationTotal }
        summary.value.currentPage: { source: data.currentPage }
        summary.value.pageSize: { source: data.pageSize }
      events:
        pageChange: changePage
  states:
    loading: { name: 読み込み中, initial: true }
    loaded: { name: 表示中 }
    empty: { name: 該当なし }
  events:
    onLoaded: { trigger: dataLoaded, from: loading, to: loaded }
    onEmpty: { trigger: dataEmpty, from: loading, to: empty }
    search:
      trigger: click
      target: searchButton
      from: loaded
      to: loading
      action: { apiCall: listNotifications }
    sortNotifications:
      trigger: { component: notificationTable, event: sortChange }
      from: loaded
      to: loading
      action: { apiCall: listNotifications }
    changePage:
      trigger: { component: notificationPagination, event: pageChange }
      from: loaded
      to: loading
      action: { apiCall: listNotifications }
    openNotification:
      trigger: { component: notificationTable, event: rowSelect }
      from: loaded
      to: loaded
    createNotification:
      trigger: click
      target: createButton
      from: loaded
      to: loaded
  transitions:
    toNotificationDetail: { to: notification-detail, trigger: openNotification }
    toNotificationEdit: { to: notification-edit, trigger: createNotification }
  apiBindings:
    listNotifications:
      openapi: { operationId: listNotifications, specRef: ../../openapi/notifications.yaml }
      request:
        query:
          keyword: "{fields.keyword}"
          status: "{fields.status}"
          page: "{event.page}"
      response:
        mapping:
          data.notificationRows: data
          data.notificationTotal: total
          data.currentPage: page
          data.pageSize: pageSize
