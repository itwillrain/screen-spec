specVersion: "0.1"
screen:
  id: user-list
  name: ユーザー一覧画面
  description: ユーザーを検索・一覧する画面
  route: /users
  design:
    images:
      - url: wireframes/user-list.svg
        caption: ユーザー一覧

  layout:
    sections:
      - id: globalHeader
        region: header
        items:
          - component: appHeader
      - id: navigation
        region: sidebar
        items:
          - component: adminSidebar
      - id: search
        title: 検索条件
        region: body
        fields: [keyword, role, searchButton]
        items:
          - field: keyword
          - field: role
          - field: searchButton
      - id: results
        title: 検索結果
        region: body
        items:
          - component: userTable
          - component: userPagination
      - id: globalFooter
        region: footer
        items:
          - component: appFooter

  fields:
    keyword:
      label: 検索キーワード
      type: text
      validations:
        - $ref: "./common.yaml#/components/validations/Required"
    role:
      label: ロール絞り込み
      type: select
      options:
        $ref: "./common.yaml#/components/options/RoleOptions"
    searchButton:
      label: 検索ボタン
      type: button
      text: 検索する
      eventId: search

  data:
    userRows:
      description: 一覧に表示するユーザー
      schema:
        type: array
        items: { type: object }
    userTotal:
      description: 検索結果の総件数
      schema: { type: integer }
    userPage:
      description: 現在ページ
      schema: { type: integer }
    userPageSize:
      description: 1ページの表示件数
      schema: { type: integer }

  ui:
    appHeader:
      component:
        $ref: "./common.yaml#/components/ui/AppHeader"
      bindings:
        currentUserName.text: { value: 山田 太郎 }
        notifications.value: { value: 3 }
      events:
        logout: logout
    adminSidebar:
      component:
        $ref: "./common.yaml#/components/ui/AdminSidebar"
      bindings:
        navigationItems.activeItem: { value: users }
      events:
        navigate: navigateFromSidebar
    userTable:
      component:
        $ref: "./common.yaml#/components/ui/DataTable"
      bindings:
        rows.value: { source: data.userRows }
        header.value:
          value:
            - { key: name, label: 氏名 }
            - { key: email, label: メールアドレス }
            - { key: role, label: ロール }
            - { key: status, label: ステータス }
        rows.rowKey: { value: id }
        rows.loading: { source: api.listUsers.loading }
        emptyState.text: { value: 条件に一致するユーザーはいません }
      events:
        rowSelect: openUser
        sortChange: sortUsers
    userPagination:
      component:
        $ref: "./common.yaml#/components/ui/Pagination"
      bindings:
        summary.value.currentPage: { source: data.userPage }
        summary.value.pageSize: { source: data.userPageSize }
        summary.value.totalCount: { source: data.userTotal }
        pageNumbers.loading: { source: api.listUsers.loading }
        pageSizeSelector.options: { value: [20, 50, 100] }
      events:
        pageChange: changePage
        pageSizeChange: changePageSize
    appFooter:
      component:
        $ref: "./common.yaml#/components/ui/AppFooter"
      bindings:
        copyright.text: { value: "© 2026 Example Inc." }
        legalLinks.value:
          value:
            - { id: privacy, label: プライバシー }
            - { id: terms, label: 利用規約 }

  states:
    loading: { name: 読み込み中, initial: true }
    loaded: { name: 表示中 }
    empty: { name: 該当なし }

  events:
    onLoaded: { trigger: dataLoaded, from: loading, to: loaded }
    onEmpty: { trigger: dataEmpty, from: loading, to: empty }
    search:
      trigger: submit
      target: searchButton
      from: loaded
      to: loading
      action: { apiCall: listUsers }
    changePage:
      trigger: { component: userPagination, event: pageChange }
      from: loaded
      to: loading
      action: { apiCall: listUsers }
    changePageSize:
      trigger: { component: userPagination, event: pageSizeChange }
      from: loaded
      to: loading
      action: { apiCall: listUsers }
    openUser:
      trigger: { component: userTable, event: rowSelect }
      from: loaded
      to: loaded
    sortUsers:
      trigger: { component: userTable, event: sortChange }
      from: loaded
      to: loading
      action: { apiCall: listUsers }
    navigateFromSidebar:
      trigger: { component: adminSidebar, event: navigate }
      from: loaded
      to: loaded
    logout:
      trigger: { component: appHeader, event: logout }
      from: loaded
      to: loaded

  transitions:
    toUserEdit: { to: user-edit, trigger: openUser }
    toAuditLog: { to: audit-log, trigger: navigateFromSidebar }

  apiBindings:
    listUsers:
      openapi:
        operationId: listUsers
        specRef: ./openapi/users.yaml
      request:
        query:
          keyword: "{fields.keyword}"
          role: "{fields.role}"
          page: "{event.page}"
          pageSize: "{event.pageSize}"
      response:
        mapping:
          data.userRows: data
          data.userTotal: total
          data.userPage: page
          data.userPageSize: pageSize
