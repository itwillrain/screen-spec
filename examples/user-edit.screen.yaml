specVersion: "0.1"
screen:
  id: user-edit
  name: ユーザー編集画面
  description: ユーザー情報を編集する画面
  route: /users/{userId}/edit
  fields:
    # マップのキー（name / email / role）がフィールド識別子。記述順＝表示順（決定 #5, #6）。
    name:
      label: 氏名
      type: text
      required: true
      validations:
        - $ref: "./common.yaml#/components/validations/Required"
        - rule: maxLength
          value: 50
          message: 50文字以内で入力してください
    # 外部コンポーネントを純粋参照（決定 #2, #3）。
    email:
      $ref: "./common.yaml#/components/fields/EmailField"
    role:
      label: ロール
      type: select
      options:
        $ref: "./common.yaml#/components/options/RoleOptions"
      permission:
        editRoles: [admin]

  # 状態遷移（決定 #10・案C）。キーが状態/イベント識別子、記述順が並び順。
  states:
    viewing:
      name: 閲覧中
      initial: true
    editing:
      name: 編集中
    submitting:
      name: 送信中
    error:
      name: エラー

  events:
    edit:
      trigger: click
      target: editButton
      from: viewing
      to: editing
    submit:
      trigger: click
      target: submitButton
      from: editing
      to: submitting
      action:
        apiCall: updateUser
      onSuccess:
        to: viewing
        navigate: user-list
      onError:
        to: error
    cancel:
      trigger: click
      target: cancelButton
      from: editing
      to: viewing
    retry:
      trigger: click
      from: error
      to: editing

  transitions:
    toUserList:
      to: user-list
      trigger: submit.onSuccess
