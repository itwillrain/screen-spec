specVersion: "0.1"
screen:
  id: user-edit
  name: ユーザー編集画面
  description: ユーザー情報を編集する画面
  route: /users/{userId}/edit

  # デザイン参照（Figma・モックアップ画像・関連リンク）。UI 実装は伴わない。
  design:
    figma: https://www.figma.com/file/EXAMPLE/user-edit
    images:
      - url: https://placehold.co/640x400?text=user-edit+viewing
        caption: 初期表示（閲覧中）
      - url: https://placehold.co/640x400?text=user-edit+editing
        caption: 編集中
    links:
      - label: デザインガイドライン
        url: https://example.com/design-guide

  # 言語レベルのレイアウト（UI 非依存の構造）。フィールドはキー参照でセクションに配置する。
  layout:
    sections:
      - id: basic
        title: 基本情報
        columns: 2
        fields: [name, email, altEmail]
      - id: authz
        title: 権限
        fields: [role]

  fields:
    # マップのキー（name / email / role）がフィールド識別子。記述順＝表示順（決定 #5, #6）。
    name:
      label: 氏名
      type: text
      required: true
      width: half
      validations:
        - $ref: "./common.yaml#/components/validations/Required"
        - rule: maxLength
          value: 50
          message: 50文字以内で入力してください
    # 外部コンポーネントを純粋参照（決定 #2, #3）。
    email:
      $ref: "./common.yaml#/components/fields/EmailField"
    role:
      label: ロール
      type: select
      options:
        $ref: "./common.yaml#/components/options/RoleOptions"
      permission:
        editRoles: [admin]
    # compose（決定 #12）: EmailField を土台に、ラベルと必須のみローカルで上書き。
    altEmail:
      compose:
        - $ref: "./common.yaml#/components/fields/EmailField"
      label: 予備メールアドレス
      required: false
      width: half

  # 状態遷移（決定 #10・案C）。キーが状態/イベント識別子、記述順が並び順。
  states:
    viewing:
      name: 閲覧中
      initial: true
    editing:
      name: 編集中
    submitting:
      name: 送信中
    error:
      name: エラー

  events:
    edit:
      trigger: click
      target: editButton
      from: viewing
      to: editing
    submit:
      trigger: click
      target: submitButton
      from: editing
      to: submitting
      action:
        apiCall: updateUser
      onSuccess:
        to: viewing
        navigate: user-list
      onError:
        to: error
    cancel:
      trigger: click
      target: cancelButton
      from: editing
      to: viewing
    retry:
      trigger: click
      from: error
      to: editing

  transitions:
    toUserList:
      to: user-list
      trigger: submit.onSuccess

  # API 連携（決定 #11・案B）。型/制約は OpenAPI 側に委譲し、対応関係のみ記述する。
  apiBindings:
    getUser:
      openapi:
        operationId: getUserById
        specRef: ./openapi/users.yaml
      request:
        path:
          userId: "{screen.route.userId}"
      response:
        mapping:
          name: data.name
          email: data.email
          role: data.role
    updateUser:
      openapi:
        operationId: updateUserById
        specRef: ./openapi/users.yaml
      request:
        body:
          name: "{fields.name}"
          email: "{fields.email}"
          role: "{fields.role}"
