specVersion: "0.1"
components:
  validations:
    Required:
      rule: required
      message: 必須項目です
    EmailFormat:
      rule: pattern
      value: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
      message: メールアドレスの形式が正しくありません
  fields:
    EmailField:
      label: メールアドレス
      type: email
      required: true
      validations:
        - $ref: "#/components/validations/Required"
        - $ref: "#/components/validations/EmailFormat"
  options:
    RoleOptions:
      - { value: admin, label: 管理者 }
      - { value: editor, label: 編集者 }
      - { value: viewer, label: 閲覧者 }

  ui:
    AppHeader:
      name: アプリケーションヘッダー
      description: 管理画面共通のブランド、現在ユーザー、主要操作をまとめたField集合
      fields:
        brand: { label: 製品名, type: label, text: Admin Console }
        currentUserName: { label: 現在のユーザー, type: label }
        notifications: { label: 通知, type: button, text: 通知, eventId: openNotifications }
        accountMenu: { label: アカウントメニュー, type: button, text: ログアウト, eventId: logout }
    AdminSidebar:
      name: 管理ナビゲーション
      description: 管理画面共通の主要ナビゲーションをまとめたField集合
      fields:
        navigationItems:
          label: 管理メニュー
          type: list
          default:
            - { id: dashboard, label: ダッシュボード }
            - { id: users, label: ユーザー管理 }
            - { id: audit, label: 監査ログ }
          eventId: navigate
    AppFooter:
      name: アプリケーションフッター
      description: 管理画面共通の補助リンクと著作権表示をまとめたField集合
      fields:
        legalLinks: { label: 補助リンク, type: list, eventId: openLink }
        copyright: { label: 著作権表示, type: label }
    DataTable:
      name: データテーブル
      description: 一覧の見出し、行、空表示をまとめたField集合
      fields:
        header: { label: 列見出し, type: list, eventId: sortChange }
        rows: { label: データ行, type: table, eventId: rowSelect }
        emptyState: { label: 空表示, type: label, text: データがありません }
    Pagination:
      name: ページネーション
      description: ページ移動と件数表示をまとめたField集合
      fields:
        previous: { label: 前へ, type: button, text: 前へ, eventId: pageChange }
        pageNumbers: { label: ページ番号, type: list, eventId: pageChange }
        next: { label: 次へ, type: button, text: 次へ, eventId: pageChange }
        pageSizeSelector: { label: 表示件数, type: select, eventId: pageSizeChange }
        summary: { label: 件数表示, type: label }
